<script>const D={"stops": [["station", "佛罗伦萨 SMN 火车站", "Firenze Santa Maria Novella", "Piazza della Stazione, 50123 Firenze", "车站", "带车票二维码及有效身份证件；提前查看站台。"], ["hotel", "酒店｜寄存行李", "5 Minuti - Duomo Tripla Suite Luxury", "Via Sant'Egidio 1, 50121 Firenze", "住宿", "提前联系酒店确认提前寄存、次日退房寄存及入住证件要求。"], ["acc", "美术学院｜《大卫》", "Galleria dell’Accademia di Firenze", "Via Ricasoli 58/60, 50122 Firenze", "11/4 免费", "免费日无法预约，现场排队；无大型行李；安检；建议带护照或证件。"], ["duomo", "圣母百花大教堂", "Cattedrale di Santa Maria del Fiore", "Piazza del Duomo, 50122 Firenze", "免费外观/教堂", "教堂通常周一至周六10:15–15:45开放；入内遮肩、过膝，不穿拖鞋。"], ["signoria", "领主广场与旧宫", "Piazza della Signoria / Palazzo Vecchio", "Piazza della Signoria, 50122 Firenze", "免费广场", "外观及雕塑免费；旧宫内部另购票。"], ["ponte", "老桥", "Ponte Vecchio", "Ponte Vecchio, 50125 Firenze", "免费", "桥上人多，注意随身物品；从河岸拍全景。"], ["mich", "米开朗基罗广场", "Piazzale Michelangelo", "Piazzale Michelangelo, 50125 Firenze", "免费", "11月初约17点日落；争取16:15前抵达；上坡台阶多，穿舒适鞋。"], ["uffizi", "乌菲兹美术馆", "Galleria degli Uffizi", "Piazzale degli Uffizi 6, 50122 Firenze", "11/4 免费", "免费日不预约，排队不可预测；馆内约2小时；大型背包寄存；安检。"], ["porc", "小猪凉廊", "Loggia del Mercato Nuovo / Fontana del Porcellino", "Piazza del Mercato Nuovo, 50123 Firenze", "免费", "拍照5–10分钟即可。"], ["repub", "共和国广场", "Piazza della Repubblica", "Piazza della Repubblica, 50123 Firenze", "免费", "看旋转木马和历史咖啡馆。"], ["lorenzo", "圣洛伦佐教堂", "Basilica di San Lorenzo", "Piazza di San Lorenzo 9, 50123 Firenze", "外观免费", "入内另需门票；注意宗教场所着装。"], ["riccardi", "美第奇—里卡迪宫", "Palazzo Medici Riccardi", "Via Camillo Cavour 3, 50129 Firenze", "外观免费", "内部参观需另购票，建议本次外观即可。"], ["market", "中央市场", "Mercato Centrale Firenze", "Piazza del Mercato Centrale, 50123 Firenze", "自由消费", "一层传统市场与楼上餐饮营业时间可能不同。"], ["dante", "但丁故居", "Museo Casa di Dante", "Via Santa Margherita 1, 50122 Firenze", "外观免费", "内部参观另购票；可作机动补充。"], ["ann", "圣母领报广场", "Piazza della Santissima Annunziata", "Piazza della Santissima Annunziata, 50122 Firenze", "免费", "美术学院附近，适合排队前后顺路拍照。"], ["barg", "巴杰罗美术馆", "Museo Nazionale del Bargello", "Via del Proconsolo 4, 50122 Firenze", "收费", "备选项目，若两大美术馆都参观则建议舍弃。"], ["lunch", "简餐／补充体力", "Pranzo veloce", "Via Sant'Egidio, 50121 Firenze", "餐饮", "就近吃饭；免费日排队前备水和小零食。"], ["walkhill", "步行上山／打车", "Verso Piazzale Michelangelo", "Piazzale Michelangelo, 50125 Firenze", "交通", "老桥附近出发，步行约30–40分钟且有坡；延误时改打车。"], ["night", "晚餐与老城夜景", "Centro storico di Firenze", "Piazza del Duomo, 50122 Firenze", "自由活动", "注意餐厅营业时间；夜间留意随身财物。"], ["decision", "乌菲兹排队截止决策", "Decisione: Uffizi o tramonto", "Piazzale degli Uffizi 6, 50122 Firenze", "关键提醒", "15:00之后才开始排队，通常不可能完整看完乌菲兹又赶上日落；不要为了免费硬排。"]], "plans": {"A": {"11-04": [["09:26–11:39", "station"], ["11:40–12:20", "hotel"], ["12:20–12:50", "lunch"], ["13:00–15:00", "acc"], ["15:00–15:25", "duomo"], ["15:25–15:45", "signoria"], ["15:45–16:05", "ponte"], ["16:05–16:40", "walkhill"], ["16:40–17:20", "mich"], ["19:00–20:00", "night"]], "11-05": [["08:30–10:45", "uffizi"], ["10:45–11:05", "porc"], ["11:05–11:30", "repub"], ["11:30–12:15", "lorenzo"], ["12:15–13:15", "market"], ["13:15–13:35", "riccardi"], ["13:35–14:20", "dante"], ["15:15–16:15", "hotel"], ["17:20–19:34", "station"]]}, "B": {"11-04": [["09:26–11:39", "station"], ["11:40–12:20", "hotel"], ["12:20–12:50", "lunch"], ["13:00–14:45", "acc"], ["14:45–15:00", "signoria"], ["15:00 起（仅排队短时）", "uffizi"], ["16:00 前决定", "decision"], ["16:10–16:45", "walkhill"], ["16:45–17:20", "mich"]], "11-05": [["09:00–09:30", "ann"], ["09:30–10:15", "duomo"], ["10:15–10:45", "dante"], ["10:45–11:15", "barg"], ["11:15–11:45", "porc"], ["11:45–12:15", "repub"], ["12:15–13:15", "market"], ["13:15–13:45", "lorenzo"], ["13:45–14:10", "riccardi"], ["15:15–16:15", "hotel"], ["17:20–19:34", "station"]]}}};const days=[['10-31','10/31','准备'],['11-01','11/01','待定'],['11-02','11/02','待定'],['11-03','11/03','待定'],['11-04','11/04','佛罗伦萨'],['11-05','11/05','佛罗伦萨']];let date='10-31',plan=localStorage.getItem('italy-plan')||'A';let done=JSON.parse(localStorage.getItem('italy-checks')||'{}');const el=id=>document.getElementById(id);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;'}[c]));const map=s=>'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(s);const checklist=[
['证件与入境','护照原件，确认有效期及适用入境要求','签证、居留许可等适用材料（按本人国籍和身份）','重要证件拍照/加密备份，紧急联系人信息'],
['订单与交通','保存所有机票及高铁车票二维码/截图','确认威尼斯—佛罗伦萨往返列车日期、车次、站名','下载酒店确认单、联系电话、完整地址','向佛罗伦萨酒店确认11/4提前寄存、11/5退房后寄存','核对11/1—11/3住宿及交通（待补充）'],
['景点门票','11/4美术学院免费日：核对开放与排队规则','方案A：预订11/5乌菲兹定时门票','方案B：11/4乌菲兹免费日无法预约，接受排队风险','优惠票如适用，携带对应有效年龄/身份/学生证明'],
['随身用品','手机、充电器、充电宝、欧标转换插头','意大利手机流量/eSIM，提前下载离线地图','雨伞/防雨外套、保暖外套、舒适步行鞋','常用药品及处方证明（如适用）','教堂参观服装：遮肩、过膝','银行卡、少量欧元现金、旅行保险资料（如适用）']
];function check(k,label){return `<label class="check"><input type="checkbox" ${done[k]?'checked':''} onchange="done['${k}']=this.checked;localStorage.setItem('italy-checks',JSON.stringify(done))"><span>${esc(label)}</span></label>`}
function card(id,t,i){let s=D.stops.find(x=>x[0]===id);return `<article class="card"><div class="time">${esc(t)} <span class="tag">${esc(s[4])}</span></div><div class="name">${esc(s[1])}</div><div class="latin">${esc(s[2])}</div><div class="addr">📍 ${esc(s[3])}</div><div class="note">注意：${esc(s[5])}</div><div class="actions"><a href="${map(s[3])}" target="_blank" rel="noopener">地图导航 ↗</a><button data-address="${esc(s[3])}" onclick="copyAddress(this)">复制地址</button><label class="small"><input type="checkbox" ${done['stop'+date+plan+i]?'checked':''} onchange="done['stop${date}${plan}${i}']=this.checked;localStorage.setItem('italy-checks',JSON.stringify(done))"> 已完成</label></div></article>`}
function copyAddress(btn){const s=btn.getAttribute('data-address');navigator.clipboard.writeText(s).then(()=>btn.textContent='已复制').catch(()=>prompt('复制以下地址',s))}
function switchDay(d){date=d;render()}function switchPlan(p){plan=p;localStorage.setItem('italy-plan',p);render()}
function render(){el('datebar').innerHTML=days.map(([d,label,desc])=>`<button class="${date===d?'active':''}" onclick="switchDay('${d}')">${label}<br><span style="font-size:11px;font-weight:400">${desc}</span></button>`).join('');let h='';if(date==='10-31'){h='<h2>10月31日 · 出发前 Checklist</h2><p class="small">按类别勾选；同一浏览器中自动保留勾选状态。</p>';checklist.forEach(([title,...items],j)=>{h+=`<section class="card"><b>${title}</b>${items.map((x,i)=>check('prep'+j+'-'+i,x)).join('')}</section>`})}else if(['11-01','11-02','11-03'].includes(date)){h=`<h2>${date.replace('-','月')}日 · 行程待定</h2><div class="empty">这一天暂时留空。<br>等你确定目的地、交通和酒店后，再补充详细行程。<p class="small">不会自动填入未经确认的安排。</p></div>`}else{h=`<h2>${date==='11-04'?'11月4日 · 抵达佛罗伦萨':'11月5日 · 返回威尼斯'}</h2><div class="plans"><button class="${plan==='A'?'active':''}" onclick="switchPlan('A')">A · 稳妥方案</button><button class="${plan==='B'?'active':''}" onclick="switchPlan('B')">B · 双馆免费挑战</button></div><div class="warn">${plan==='A'?'11/4 优先免费参观美术学院；11/5 预约付费参观乌菲兹。':'11/4 先排美术学院，只有排队极短才尝试乌菲兹；两个免费场馆都不能预约。无法保证两馆完整参观及日落。'}<br><b>美术学院如排队超过约90分钟，需减少后续景点；米开朗基罗广场日落优先。</b></div>`;h+=D.plans[plan][date].map(([t,id],i)=>card(id,t,i)).join('');h+=`<div class="card links"><b>官方信息核对</b><a href="https://www.galleriaaccademiafirenze.it/en/visit/" target="_blank">美术学院：开放时间及免费日</a><a href="https://www.uffizi.it/en/tickets" target="_blank">乌菲兹：官方门票</a><a href="https://duomo.firenze.it/en/visit/plan-your-visit" target="_blank">大教堂建筑群：参观与门票</a></div>`}el('content').innerHTML=h}render();</script></body></html>
