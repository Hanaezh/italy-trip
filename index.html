async function getWeather(){if(weatherCache)return weatherCache;if(weatherPromise)return weatherPromise;weatherPromise=Promise.all([{name:'威尼斯',lat:45.44,lon:12.34},{name:'佛罗伦萨',lat:43.77,lon:11.25}].map(async c=>{try{const r=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${c.lat}&longitude=${c.lon}&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=Europe%2FRome&forecast_days=16`,{signal:AbortSignal.timeout(12000)});if(!r.ok)throw Error();const v=await r.json();if(!v.daily?.time)throw Error();return {...c,d:v.daily}}catch{return {...c,error:true}}}));weatherCache=await weatherPromise;weatherPromise=null;return weatherCache}
async function weather(){const box=el('weather-data');const data=await getWeather();if(!box.isConnected)return;box.innerHTML=data.map(c=>`<section class="card"><h3>${c.name}</h3>${c.error?'<p>暂时无法获取天气，请联网后重试。没有用示例温度代替预报。</p>':Array.from({length:7},(_,i)=>{const dt=new Date(Date.UTC(2026,9,31+i)).toISOString().slice(0,10),idx=c.d.time.indexOf(dt),a=c.d.temperature_2m_min[idx],b=c.d.temperature_2m_max[idx],rain=c.d.precipitation_probability_max[idx];return `<div class="weather-row"><span>${dt.slice(5).replace('-','/')}</span><span>${idx<0?'该日期预报尚未开放或已超出当前预报范围':a==null||b==null?'温度数据暂缺':`${a}–${b}°C · 降雨 ${rain==null?'数据暂缺':rain+'%'}`}</span></div>`}).join('')}</section>`).join('')}
function render(){el('datebar').innerHTML=days.map(([d,l,s])=>`<button data-day="${d}" class="${date===d?'active':''}" aria-current="${date===d?'page':'false'}">${l}<small>${s}</small></button>`).join('');let h='';if(date==='10-31'){h='<div class="page-top"><h2>出发前，逐项安心。</h2><span class="status">10月31日 · PREPARE</span></div><p class="sub"></p><div class="progress"><span id="prep-progress"></span><progress id="progress-meter" aria-label="准备进度"></progress></div><div class="grid">'+PREP.map((x,j)=>prepCard(x,j)).join('')+'</div>'}else if(date==='overview')h=overview();else if(date==='weather'){h='<h2>天气，出门前再看一眼。</h2><p class="sub">威尼斯与佛罗伦萨 · 10/31—11/6 · 意大利当地日期</p><div class="note">公开预报最长约16天；范围外日期会明确提示。预测随时间更新，雨天请预留交通余量。</div><div class="grid" id="weather-data" aria-live="polite">正在获取天气…</div><p class="small">天气来源：<a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo</a>（CC BY 4.0）。打开本栏目时获取，刷新可更新。</p><button class="retry" data-weather>刷新天气</button>'}else if(['11-01','11-02','11-03'].includes(date)){h=`<h2>${date.replace('-','月')}日 · 留一点期待</h2><p class="sub">每日行程待补充</p><div class="empty"><strong>To be continued.</strong>这一天的目的地和活动尚待确认。<p class="small">威尼斯酒店持续保留，具体外出计划之后再补充。</p></div>`}else{h=`<h2>${date==='11-04'?'11月4日 · 初见佛罗伦萨':'11月5日 · 夜归威尼斯'}</h2><p class="sub"></p><div class="plans"><button data-plan="A" class="${plan==='A'?'active':''}" aria-pressed="${plan==='A'}">主要方案 · 11/4 两馆同日</button><button data-plan="B" class="${plan==='B'?'active':''}" aria-pressed="${plan==='B'}">备选方案 · 分开两天</button></div><div class="warn">${plan==='A'?'先到住宿放行李，再吃饭；11/4的重点是美术学院和乌菲兹，最后去米开朗基罗广场。':'11/4放行李、吃饭后参观美术学院；乌菲兹安排在11/5，再去米开朗基罗广场。'} 4日两个馆都可能排队，若美术学院延误，优先压缩米开朗基罗广场，不再增加其他景点。</div>`;let rows=D.plans[plan][date].map(x=>[...x]);h+=rows.map(([t,id])=>card(id,t)).join('');h+='<div class="links"><a href="https://www.galleriaaccademiafirenze.it/en/visit/" target="_blank" rel="noopener">美术学院官方参观信息 ↗</a><a href="https://www.uffizi.it/en/tickets" target="_blank" rel="noopener">乌菲兹官方门票 ↗</a><a href="https://duomo.firenze.it/en/visit/plan-your-visit" target="_blank" rel="noopener">大教堂建筑群 ↗</a></div>'}el('content').innerHTML=h;progress();if(date==='weather')weather()}
document.addEventListener('change',e=>{if(e.target.matches('input[data-key]'))setDone(e.target.dataset.key,e.target.checked);if(e.target.matches('.item-edit')){prepLabels[e.target.dataset.labelKey]=e.target.value.trim();savePrep()}});document.addEventListener('input',e=>{if(e.target.matches('.item-edit')){prepLabels[e.target.dataset.labelKey]=e.target.value;savePrep()}});
document.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.day){date=b.dataset.day;history.replaceState(null,'','#'+date);render();window.scrollTo({top:0,behavior:'smooth'})}if(b.dataset.plan){plan=b.dataset.plan;save('italy-ui-v2',{plan});render()}if(b.dataset.addPrep){const input=document.querySelector('input[data-new-prep="'+b.dataset.addPrep+'"]');const text=(input?.value||'').trim();if(text){const id='custom-'+Date.now();(prepCustom[b.dataset.addPrep]??=[]).push({id,text});savePrep();render()}}if(b.dataset.removePrep){prepDeleted[b.dataset.removePrep]=true;savePrep();render()}if(b.dataset.copy){try{await navigator.clipboard.writeText(b.dataset.copy);b.textContent='已复制'}catch{prompt('请复制地址',b.dataset.copy)}}if(b.hasAttribute('data-weather')){weatherCache=null;render()}});
document.addEventListener('error',e=>{if(e.target.matches('img[data-fallback]')){const img=e.target;img.hidden=true;const label=document.createElement('span');label.textContent='照片暂时无法加载 · 点击查看原图 ↗';label.className='note';img.parentElement.append(label)}},true);
window.addEventListener('hashchange',()=>{if(days.some(x=>x[0]===location.hash.slice(1))){date=location.hash.slice(1);render()}});render();
</script></body></html>
